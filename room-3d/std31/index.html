<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>S.House — ห้อง 3 มิติ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D stage. A slim title card floats top-left, the language switch top-right,
   and a scrolling rail of viewpoints sits on the bottom edge. Room labels float over the model. */
:root{
  --bg:#E8EEF6; --ink:#0F2B5B; --muted:#4F5F7A;
  --panel:rgba(255,255,255,.92); --line:rgba(15,43,91,.16);
  --accent:#0F2B5B; --accent-ink:#FFFFFF; --brand:#E06F1F; --brand-ink:#B8540F; --chip:#FFFFFF;
  --shadow:0 6px 24px rgba(15,43,91,.18);
  --font-display:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1730; --ink:#E8EEF8; --muted:#A5B4CC;
    --panel:rgba(14,26,50,.88); --line:rgba(232,238,248,.2);
    --accent:#F3A262; --accent-ink:#1A0E02; --brand:#F3A262; --brand-ink:#F3A262; --chip:#16264A;
    --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1730; --ink:#E8EEF8; --muted:#A5B4CC;
  --panel:rgba(14,26,50,.88); --line:rgba(232,238,248,.2);
  --accent:#F3A262; --accent-ink:#1A0E02; --brand:#F3A262; --brand-ink:#F3A262; --chip:#16264A;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--font-body);
  box-sizing:border-box; overflow:hidden;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
#stage{position:fixed; inset:0; z-index:0; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; background:#CFE0EA}
#stage.drag{cursor:grabbing}
#cv{display:block; width:100%; height:100%; outline:none}

.tags{position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden}
.tag{
  position:absolute; left:0; top:0; pointer-events:auto; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  background:var(--panel); color:var(--ink); border:1px solid var(--line);
  border-radius:999px; padding:6px 12px 6px 10px;
  font:500 13px/1 var(--font-display); white-space:nowrap;
  box-shadow:var(--shadow); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  opacity:0; visibility:hidden; transition:opacity .3s;
}
.tag::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--brand)}
.tags[data-on="1"] .tag{opacity:1; visibility:visible}
.tag:focus-visible,.chip:focus-visible,.lang button:focus-visible{outline:2px solid var(--brand); outline-offset:2px}

.ui{position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:space-between; pointer-events:none; min-width:0}
.ui > *{min-width:0}
.top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.card{
  pointer-events:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.title{padding:10px 14px 11px; max-width:min(380px,66vw)}
.eyebrow{display:flex; align-items:center; gap:7px; font:600 12px/1 var(--font-display); letter-spacing:.14em; color:var(--brand-ink)}
.logo{display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; background:var(--brand); color:#fff; font:600 12px/1 var(--font-display); letter-spacing:0}
h1{margin:7px 0 0; font:600 21px/1.2 var(--font-display); text-wrap:balance}
.meta{margin:6px 0 0; font-size:13.5px; color:var(--ink); white-space:pre-line}
.note{margin:5px 0 0; font-size:12px; line-height:1.4; color:var(--muted)}
.lang{display:flex; padding:3px; gap:2px; border-radius:999px; flex:none}
.lang button{
  font:600 13px/1 var(--font-display); letter-spacing:.04em; color:var(--muted); background:transparent;
  border:0; border-radius:999px; padding:10px 12px; min-width:44px; min-height:40px; cursor:pointer;
}
.lang button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

.bottom{display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0}
.hint{
  pointer-events:none; background:var(--panel); color:var(--ink); border:1px solid var(--line);
  border-radius:999px; padding:8px 15px; font-size:13.5px; text-align:center; max-width:100%;
  box-shadow:var(--shadow); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  transition:opacity .5s; text-wrap:balance;
}
.hint[data-show="0"]{opacity:0}
.rail{
  pointer-events:auto; display:flex; gap:8px; max-width:100%; box-sizing:border-box;
  overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none; justify-content:safe center;
  -webkit-overflow-scrolling:touch;
}
.rail::-webkit-scrollbar{display:none}
.chip{
  flex:none; min-height:44px; padding:0 16px; cursor:pointer;
  font:500 14px/1 var(--font-display); color:var(--ink); background:var(--chip);
  border:1px solid var(--line); border-radius:999px; box-shadow:0 1px 3px rgba(15,43,91,.22);
}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:transparent}

.fail{position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; background:var(--bg)}
.fail[hidden]{display:none!important}
.fail p{max-width:32ch; margin:0; font-size:16px; line-height:1.6}
@media (prefers-reduced-motion:reduce){ .tag,.hint{transition:none} }
</style>
</head>
<body>

<div id="stage"><canvas id="cv" role="img" tabindex="0"></canvas></div>
<div class="tags" id="tags" data-on="0"></div>
<div class="ui">
  <div class="top">
    <div class="card title">
      <div class="eyebrow"><span class="logo" aria-hidden="true">S</span>S.HOUSE</div>
      <h1 id="ttl"></h1>
      <p class="meta" id="meta"></p>
      <p class="note" id="note"></p>
    </div>
    <div class="card lang" role="group" aria-label="Language">
      <button id="lth" type="button" aria-pressed="true">TH</button>
      <button id="len" type="button" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="bottom">
    <div class="hint" id="hint" role="status" data-show="0"></div>
    <div class="rail" id="rail" role="group"></div>
  </div>
</div>
<div class="fail" id="fail" hidden><p id="failtxt"></p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

const $ = id => document.getElementById(id);
const cv = $('cv'), stage = $('stage');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine = matchMedia('(pointer: fine)').matches;
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ------------------------------------------------------------------
   S.House Standard Window 31 sq.m. Metres. Origin = centre of the bedroom floor. Room 4.0 (x) x 5.6 (z).
   Plan (from the 12 room photos; approximate):
   - EAST wall (+x) = bed head: arched wooden headboard, black leatherette mattress on a wooden storage base,
     small wooden bedside table at the south end. The brown entrance door is in the south wall right next to the south-east corner.
   - SOUTH wall (+z): wall pier + breaker box (high), honey-wood 2-door wardrobe, pier beside the south-west corner.
   - WEST wall (-x), from the south: sliding balcony door (navy curtains) with the split A/C above, wooden-framed mirror + black-glass desk
     + beige chair, light switch, the grey-framed bathroom door.
   - NORTH wall (-z): big 2-pane window with navy curtains + pendant lamp, small black-glass table with two pink shell chairs.
   - Bathroom = a wing west of the room (door in the west wall): vanity + oval basin along its south wall, toilet at the far (west) end,
     curved tiled shower corner next to the door. Balcony wing outside the sliding door.
------------------------------------------------------------------- */
const ROOM = { W:4.0, D:5.6, H:2.6, T:0.14 };

const TXT = {
  th:{
    title:'ห้อง Standard Window 31 ตร.ม.',
    meta:['หน้าต่างบานใหญ่ · ระเบียงส่วนตัว','มุมโต๊ะนั่งริมหน้าต่าง · ห้องน้ำในตัว'],
    note:'ภาพจำลอง 3 มิติ ขนาดและของตกแต่งอาจต่างจากห้องจริงเล็กน้อย · ทีวี-ตู้เย็นนำมาเองหรือเช่าได้',
    hintOrbit:'ลากเพื่อหมุนห้อง · บีบเพื่อซูม · แตะชื่อจุดเพื่อเข้าไปดู',
    hintWalk:'ลากเพื่อมองรอบห้อง · แตะที่พื้นเพื่อเดิน · บีบเพื่อซูม' + (fine ? ' · WASD' : ''),
    aria:'ภาพ 3 มิติของห้อง Standard Window 31 ตร.ม. ที่ S.House',
    fail:'อุปกรณ์หรือเบราว์เซอร์นี้แสดงภาพ 3 มิติไม่ได้ ลองเปิดด้วย Chrome หรือ Safari เวอร์ชันล่าสุด'
  },
  en:{
    title:'Standard Window Room 31 sq.m.',
    meta:['Large window · Private balcony','Window-side table nook · En-suite bathroom'],
    note:'3D model. Size and furnishings may differ slightly from the actual room. TV and fridge: bring your own or rent from us.',
    hintOrbit:'Drag to rotate · Pinch to zoom · Tap a label to step inside',
    hintWalk:'Drag to look around · Tap the floor to walk · Pinch to zoom' + (fine ? ' · WASD' : ''),
    aria:'3D view of the Standard Window 31 sq.m. room at S.House',
    fail:'This device or browser cannot show 3D. Try the latest Chrome or Safari.'
  }
};

const VIEWS = [
  { id:'overview', th:'ภาพรวม',          en:'Overview' },
  { id:'entry',   th:'ทางเข้า',            en:'Entrance',       pos:[1.45,1.55,2.3],   at:[-0.6,0.95,-1.6],  fov:78, tag:[1.5,2.0,2.35] },
  { id:'bed',     th:'เตียง',              en:'Bed',            pos:[-1.2,1.5,-0.7],   at:[2.0,0.7,-0.7],   fov:74, tag:[1.7,1.5,-0.75] },
  { id:'closet',  th:'ตู้เสื้อผ้า',         en:'Wardrobe',       pos:[0.2,1.5,0.9],     at:[-0.95,1.0,2.8],   fov:80, tag:[-0.95,2.05,2.45] },
  { id:'desk',    th:'โต๊ะ · กระจก',       en:'Desk & mirror',  pos:[0.3,1.5,0.7],     at:[-2.0,1.0,0.2],    fov:82, tag:[-1.75,1.6,0.2] },
  { id:'window',  th:'หน้าต่าง · โต๊ะนั่ง',  en:'Window nook',    pos:[-0.8,1.5,-0.6],   at:[0.05,0.9,-2.8],   fov:80, tag:[0.05,1.75,-2.4] },
  { id:'balcony', th:'ระเบียง',            en:'Balcony',        pos:[-2.7,1.5,1.3],    at:[-6.0,0.1,0.6],   fov:74, tag:[-3.0,1.3,1.7] },
  { id:'bath',    th:'ห้องน้ำ',            en:'Bathroom',       pos:[-2.35,1.55,-1.7], at:[-4.3,0.95,-2.0],  fov:100, tag:[-3.3,1.85,-1.9] }
];

/* Where a visitor may stand ([x0,x1,z0,z1]) and what blocks them */
const WALK = [
  [-1.95,1.95,-2.65,2.65],                          // the room
  [-2.25,-1.9,-1.9,-1.15],                          // bathroom doorway
  [-4.45,-2.2,-2.75,-1.15],                         // bathroom
  [-2.25,-1.9,0.95,2.35],                           // balcony door threshold
  [-3.3,-2.2,0.2,2.3]                               // balcony
];
const BLOCK = [
  [-0.1,2.0,-1.7,0.2],                              // bed
  [1.55,2.0,0.2,0.68],                              // bedside table
  [-1.6,-0.3,2.2,2.8],                              // wardrobe
  [0.45,0.9,2.45,2.8], [-2.0,-1.6,2.45,2.8],        // piers
  [-2.0,-1.45,-0.5,0.85], [-1.5,-0.95,-0.1,0.45],   // desk + chair
  [-0.35,0.45,-2.75,-1.95],                         // window table
  [-0.9,-0.4,-2.65,-2.05], [0.5,1.0,-2.65,-2.05],   // pink chairs
  [-2.8,-2.05,-1.25,-1.1],                          // bathroom door leaf
  [-4.5,-2.95,-1.65,-1.1],                          // vanity counter
  [-4.5,-3.75,-2.35,-1.85],                         // toilet
  [-2.3,-2.14,-2.8,-2.2], [-2.6,-2.14,-2.8,-2.5], [-2.94,-2.14,-2.8,-2.7]    // rounded shower corner
];
const FIT = [
  [-2.15,0,2.95],[-2.15,2.7,2.95],[-2.15,0,-2.95],[-2.15,2.7,-2.95],[2.15,0,2.95],[2.15,2.7,2.95],[2.15,0,-2.95],[2.15,2.7,-2.95],
  [-4.65,0,-2.95],[-4.65,2.4,-2.95],[-4.65,0,-0.95],[-4.65,2.4,-0.95],
  [-3.5,0,0.05],[-3.5,1.2,0.05],[-3.5,0,2.5],[-3.5,1.2,2.5]
];
const ORBIT = { el:.98, t:[-0.9,0.3,0.0] };
const OVAZ = a => (-1.5+1.0*a);
const START = Object.assign({ x:1.45, y:1.55, z:2.3, fov:78 }, anglesTo([1.45,1.55,2.3],[-0.6,0.95,-1.6]));



/* Start in the language the visitor already picked: ?lang= from the LINE button (th/en/zh/ja; zh and ja show English),
   then this viewer's own TH/EN toggle, then Thai. */
function normLang(v){ v = String(v || '').toLowerCase().slice(0,2); return v === 'th' ? 'th' : (v === 'en' || v === 'zh' || v === 'ja') ? 'en' : null; }
function queryLang(){ try{ return new URLSearchParams(location.search).get('lang'); }catch(e){ return null; } }
let lang = normLang(queryLang()) || normLang(LS.get('sh-lang')) || 'th';

const inAny = (L,x,z) => L.some(r => x>=r[0] && x<=r[1] && z>=r[2] && z<=r[3]);
const okPos = (x,z) => inAny(WALK,x,z) && !inAny(BLOCK,x,z);

function fail(){
  $('failtxt').textContent = TXT[lang].fail;
  $('fail').hidden = false;
}
const THREE = window.THREE;
if(!THREE){ fail(); return; }
let renderer;
try{
  renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true, powerPreference:'high-performance' });
}catch(e){ fail(); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // the room is static: shadows are rendered once
renderer.setClearColor(0xcfe0ea);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd5e5ee, 30, 180);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
const root = new THREE.Group(); scene.add(root);
const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

/* ---------------- helpers ---------------- */
const M = (c,o) => new THREE.MeshStandardMaterial(Object.assign({ color:c, roughness:.85, metalness:0 }, o||{}));
function B(x0,x1,y0,y1,z0,z1,m,parent,o){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0), m);
  mesh.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  mesh.castShadow = !(o && o.noCast); mesh.receiveShadow = !(o && o.noRecv);
  (parent||root).add(mesh); return mesh;
}
function cyl(r0,r1,h,m,x,y,z,parent,seg){
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r0,r1,h,seg||20), m);
  mesh.position.set(x,y,z); mesh.castShadow = true; mesh.receiveShadow = true;
  (parent||root).add(mesh); return mesh;
}
function rrShape(w,d,r){
  const s = new THREE.Shape(), x=-w/2, y=-d/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+d-r); s.quadraticCurveTo(x+w,y+d,x+w-r,y+d); s.lineTo(x+r,y+d);
  s.quadraticCurveTo(x,y+d,x,y+d-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
/* soft-cornered box: w (x) × h (y) × d (z), centred at x,y,z */
function rbox(w,h,d,r,b,m,x,y,z,parent){
  const sw = w-2*b, sd = d-2*b;
  const g = new THREE.ExtrudeGeometry(rrShape(sw,sd,Math.min(r,sw/2-.001,sd/2-.001)),
    { depth:h-2*b, bevelEnabled:true, bevelThickness:b, bevelSize:b, bevelSegments:2, curveSegments:6 });
  g.rotateX(-Math.PI/2); g.center();
  const mesh = new THREE.Mesh(g,m);
  mesh.position.set(x,y,z); mesh.castShadow = true; mesh.receiveShadow = true;
  (parent||root).add(mesh); return mesh;
}
let seed = 11;
const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
function canvasTex(w,h,draw){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = aniso;
  return t;
}
function tileCanvas(base,grout,noise,warm){
  return canvasTex(128,128,(g,w,h)=>{
    g.fillStyle = base; g.fillRect(0,0,w,h);
    for(let i=0;i<46;i++){ g.fillStyle = 'rgba(255,255,255,'+(rnd()*noise)+')'; g.fillRect(rnd()*w,rnd()*h,10+rnd()*50,10+rnd()*50); }
    for(let i=0;i<30;i++){ g.fillStyle = (warm||'rgba(80,60,40,')+(rnd()*noise*.7)+')'; g.fillRect(rnd()*w,rnd()*h,6+rnd()*40,6+rnd()*40); }
    g.strokeStyle = grout; g.lineWidth = 4; g.strokeRect(0,0,w,h);
  });
}
function tileM(tex,w,h,tw,th,o){
  const t = tex.clone(); t.needsUpdate = true; t.repeat.set(w/tw, h/th);
  return M(0xffffff, Object.assign({ map:t, roughness:.35 }, o||{}));
}
function blobTex(){
  return canvasTex(128,128,(g,w,h)=>{
    const r = g.createRadialGradient(w/2,h/2,w*.08,w/2,h/2,w/2);
    r.addColorStop(0,'rgba(0,0,0,.9)'); r.addColorStop(.55,'rgba(0,0,0,.35)'); r.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=r; g.fillRect(0,0,w,h);
  });
}
const blobT = blobTex();
function blob(cx,cz,w,d,op){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,d),
    new THREE.MeshBasicMaterial({ map:blobT, transparent:true, opacity:op, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.position.set(cx,0.006,cz); m.renderOrder = 1; root.add(m); return m;
}

/* wall groups that become see-through in overview mode */
const FADE = {};
function fadeGroup(name){ const g = new THREE.Group(); root.add(g); FADE[name] = { group:g, mats:[], cur:1, goal:1 }; return g; }
function fm(name,mat,base){ mat.userData.base = base==null ? 1 : base; mat.transparent = mat.userData.base < 1; FADE[name].mats.push(mat); return mat; }
function applyFade(f){
  f.mats.forEach(m => { const o = f.cur*m.userData.base; m.opacity = o; m.transparent = o < .999 || m.userData.base < 1; });
  f.group.visible = f.cur > .02;
}

/* ---------------- shared materials ---------------- */
const white = M(0xF4F5F3,{roughness:.6}), dark = M(0x2E373B,{roughness:.5,metalness:.4});
const chrome = M(0xD5DCDE,{roughness:.35,metalness:.2});
const glassM = () => new THREE.MeshStandardMaterial({ color:0xCFE6EE, roughness:.05, metalness:0, transparent:true, opacity:.14, side:THREE.DoubleSide, depthWrite:false });
const mirrorM = M(0xCBDCE2,{roughness:.06,metalness:.3,emissive:0x0F181B});

/* ---------------- wall-relative kit ----------------
   side: 'N' (z=-hz, balcony side), 'S' (z=+hz), 'W' (x=-hx), 'E' (x=+hx).
   s = position ALONG the wall (x for N/S, z for W/E), d = distance INTO the room from the wall plane
   (negative d = outside the room). */
const { W, D, H, T } = ROOM, hx = W/2, hz = D/2;
function XZ(side,s,d){ return side==='N' ? [s,-hz+d] : side==='S' ? [s,hz-d] : side==='W' ? [-hx+d,s] : [hx-d,s]; }
function WB(side,s0,s1,y0,y1,d0,d1,m,parent,o){
  const p = XZ(side,s0,d0), q = XZ(side,s1,d1);
  return B(Math.min(p[0],q[0]),Math.max(p[0],q[0]),y0,y1,Math.min(p[1],q[1]),Math.max(p[1],q[1]),m,parent,o);

}
function walkPose(w){
  return { pos:new THREE.Vector3(w.x,w.y,w.z), quat:new THREE.Quaternion().setFromEuler(new THREE.Euler(w.pitch,w.yaw,0,'YXZ')), fov:effFov(w.fov) };
}
function setCam(p){
  camera.position.copy(p.pos); camera.quaternion.copy(p.quat);
  if(Math.abs(camera.fov-p.fov) > .01){ camera.fov = p.fov; camera.updateProjectionMatrix(); }
}
function anglesTo(from,at){
  const dx = at[0]-from[0], dy = at[1]-from[1], dz = at[2]-from[2];
  return { yaw:Math.atan2(-dx,-dz), pitch:Math.atan2(dy,Math.hypot(dx,dz)) };
}
function fly(pose,dur,done,walkTarget){
  const d = camera.position.distanceTo(pose.pos);
  const time = reduce ? .01 : (dur || clamp(.7+d*.2,.8,2.0));
  tw = { p0:camera.position.clone(), q0:camera.quaternion.clone(), f0:camera.fov, p1:pose.pos, q1:pose.quat, f1:pose.fov, t:0, dur:time, done:done, walkTarget:!!walkTarget };
  S.mode = 'fly'; dirty = true; syncUI();
}
function viewWalk(v){
  const a = anglesTo(v.pos,v.at);
  return { x:v.pos[0], y:v.pos[1], z:v.pos[2], yaw:a.yaw, pitch:a.pitch, fov:v.fov };
}
function goOrbit(){
  if(S.mode === 'fly' && S.cur === 'overview') return;
  S.cur = 'overview'; S.dollhouse = true;
  if(!S.rotated) S.orbit.az = overviewAz();
  if(!S.zoomed) S.orbit.r = fitR();
  fly(orbitPose(), 0, () => { S.mode = 'orbit'; dirty = true; syncUI(); });
}
function goView(id){
  const v = VIEWS.find(x => x.id === id); if(!v || !v.pos) return;
  const w = viewWalk(v); S.cur = id;
  fly(walkPose(w), 0, () => { S.walk = w; S.mode = 'walk'; S.dollhouse = false; dirty = true; syncUI(); }, S.dollhouse);
  if(!S.dollhouse) return;
  hintOnce('walk');
}
function walkTo(x,z){
  if(!okPos(x,z)) return;
  const w = Object.assign({}, S.walk, { x:x, z:z });
  S.cur = '';
  fly(walkPose(w), 0, () => { S.walk = w; S.mode = 'walk'; dirty = true; syncUI(); });
  marker.position.set(x,.02,z); marker.visible = true; markerT = 1;
}

/* ---------------- input ---------------- */
const ptrs = new Map(); let tap = null, pinchD = 0;
const pdist = () => { const a = Array.from(ptrs.values()); return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); };
stage.addEventListener('pointerdown', e => {
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  ptrs.set(e.pointerId,{ x:e.clientX, y:e.clientY });
  hideHint();
  if(ptrs.size === 1){ tap = { x:e.clientX, y:e.clientY, t:performance.now(), moved:false }; stage.classList.add('drag'); }
  else { tap = null; pinchD = pdist(); }
});
stage.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if(!p) return;
  const dx = e.clientX-p.x, dy = e.clientY-p.y; p.x = e.clientX; p.y = e.clientY;
  if(S.mode === 'fly') return;
  if(ptrs.size === 1){
    if(tap && Math.hypot(e.clientX-tap.x, e.clientY-tap.y) > 6) tap.moved = true;
    if(S.mode === 'orbit'){
      S.rotated = true; S.orbit.az -= dx*.006; S.orbit.el = clamp(S.orbit.el+dy*.005,.25,1.5);
    }else if(S.mode === 'walk'){
      const k = S.walk.fov/74*.0042;
      S.walk.yaw += dx*k; S.walk.pitch = clamp(S.walk.pitch+dy*k,-1.2,1.2);
    }
    dirty = true;
  }else if(ptrs.size === 2){
    const d = pdist(), ratio = pinchD ? d/pinchD : 1; pinchD = d;
    zoom(ratio);
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(ptrs.size === 0) stage.classList.remove('drag');
  if(e.type === 'pointerup' && tap && !tap.moved && performance.now()-tap.t < 500 && S.mode === 'walk') pickFloor(e.clientX,e.clientY);
  tap = null; pinchD = 0;
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
function zoom(ratio){
  if(S.mode === 'orbit'){ S.orbit.r = clamp(S.orbit.r/ratio,6,32); S.zoomed = true; }
  else if(S.mode === 'walk'){ S.walk.fov = clamp(S.walk.fov/ratio,40,90); }
  dirty = true;
}
stage.addEventListener('wheel', e => { e.preventDefault(); hideHint(); zoom(Math.exp(-e.deltaY*.0012)); }, { passive:false });
const ray = new THREE.Raycaster(), floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0),0), hit = new THREE.Vector3();
function pickFloor(cx,cy){
  const r = stage.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1), camera);
  if(ray.ray.intersectPlane(floorPlane,hit)) walkTo(hit.x,hit.z);
}
const keys = new Set(), MOVE = ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(MOVE.indexOf(k) < 0 || e.ctrlKey || e.metaKey || e.altKey) return;
  keys.add(k); hideHint(); if(S.mode === 'walk') e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

/* ---------------- UI ---------------- */
const rail = $('rail'), tagsEl = $('tags'), hint = $('hint');
const chips = {}, tagEls = {};
VIEWS.forEach(v => {
  const c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.setAttribute('aria-pressed','false');
  c.addEventListener('click', () => v.id === 'overview' ? goOrbit() : goView(v.id));
  rail.appendChild(c); chips[v.id] = c;
  if(v.tag){
    const t = document.createElement('button'); t.type = 'button'; t.className = 'tag';
    t.addEventListener('click', () => goView(v.id));
    tagsEl.appendChild(t); tagEls[v.id] = t;
  }
});
let hintTimer = 0; const hintSeen = {};
function showHint(txt){ hint.textContent = txt; hint.dataset.show = '1'; clearTimeout(hintTimer); hintTimer = setTimeout(hideHint,7000); }
function hideHint(){ hint.dataset.show = '0'; clearTimeout(hintTimer); }
function hintOnce(kind){ if(hintSeen[kind]) return; hintSeen[kind] = 1; setTimeout(() => showHint(kind === 'walk' ? TXT[lang].hintWalk : TXT[lang].hintOrbit), kind === 'walk' ? 900 : 400); }
function syncUI(){
  VIEWS.forEach(v => chips[v.id].setAttribute('aria-pressed', String(v.id === S.cur)));
  tagsEl.dataset.on = (S.mode === 'orbit') ? '1' : '0';
  const c = chips[S.cur]; if(c && c.scrollIntoView){ try{ c.scrollIntoView({ block:'nearest', inline:'center', behavior: reduce ? 'auto' : 'smooth' }); }catch(e){} }
}
function applyLang(){
  const t = TXT[lang];
  document.documentElement.lang = lang;
  $('ttl').textContent = t.title; $('meta').textContent = t.meta.join('\n'); $('note').textContent = t.note;
  cv.setAttribute('aria-label', t.aria);
  VIEWS.forEach(v => { chips[v.id].textContent = v[lang]; if(tagEls[v.id]) tagEls[v.id].textContent = v[lang]; });
  $('lth').setAttribute('aria-pressed', String(lang === 'th')); $('len').setAttribute('aria-pressed', String(lang === 'en'));
  document.title = 'S.House ' + t.title;
  if(hint.dataset.show === '1') hint.textContent = (S.mode === 'walk') ? t.hintWalk : t.hintOrbit;
}
$('lth').addEventListener('click', () => { lang = 'th'; LS.set('sh-lang','th'); applyLang(); });
$('len').addEventListener('click', () => { lang = 'en'; LS.set('sh-lang','en'); applyLang(); });

/* ---------------- loop ---------------- */
function resize(){
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w,h,false); camera.aspect = w/h;
  if(S.mode === 'orbit' && !S.zoomed){ if(!S.rotated) S.orbit.az = overviewAz(); S.orbit.r = fitR(); }
  camera.updateProjectionMatrix(); dirty = true;
}
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage); else addEventListener('resize',resize);

const tv3 = new THREE.Vector3();
function fadeGoals(){
  const o = S.orbit, dx = Math.sin(o.az), dz = Math.cos(o.az), top = o.el > 1.38;
  const dh = S.dollhouse;
  const g = face => dh ? ((top || face > .22) ? 0 : 1) : 1;
  FADE.N.goal = g(-dz); FADE.S.goal = g(dz); FADE.W.goal = g(-dx); FADE.E.goal = g(dx);
  FADE.C.goal = dh ? 0 : 1; if(FADE.P) FADE.P.goal = dh ? .16 : 1;
}
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05,(now-last)/1000); last = now;
  let need = dirty; dirty = false;

  if(S.mode === 'walk' && keys.size){
    const has = k => keys.has(k);
    const fz = (has('w')||has('arrowup') ? 1:0) - (has('s')||has('arrowdown') ? 1:0);
    const fx = (has('d') ? 1:0) - (has('a') ? 1:0);
    const turn = (has('arrowleft') ? 1:0) - (has('arrowright') ? 1:0);
    S.walk.yaw += turn*1.6*dt;
    if(fx || fz){
      const sy = Math.sin(S.walk.yaw), cy = Math.cos(S.walk.yaw), sp = 1.5*dt;
      const nx = S.walk.x + (-sy*fz + cy*fx)*sp, nz = S.walk.z + (-cy*fz - sy*fx)*sp;
      if(okPos(nx,S.walk.z)) S.walk.x = nx;
      if(okPos(S.walk.x,nz)) S.walk.z = nz;
    }
    need = true;
  }
  if(tw){
    tw.t += dt/tw.dur; const k0 = Math.min(1,tw.t), k = k0*k0*(3-2*k0);
    camera.position.lerpVectors(tw.p0,tw.p1,k);
    camera.quaternion.copy(tw.q0).slerp(tw.q1,k);
    camera.fov = tw.f0 + (tw.f1-tw.f0)*k; camera.updateProjectionMatrix();
    if(tw.walkTarget && k > .5 && S.dollhouse) S.dollhouse = false;
    if(tw.t >= 1){ const d = tw.done; tw = null; if(d) d(); }
    need = true;
  }else if(need){
    if(S.mode === 'orbit') setCam(orbitPose()); else if(S.mode === 'walk') setCam(walkPose(S.walk));
  }
  fadeGoals();
  for(const k in FADE){
    const f = FADE[k];
    if(f.cur !== f.goal){
      f.cur += (f.goal-f.cur)*Math.min(1,dt*(reduce?60:9));
      if(Math.abs(f.cur-f.goal) < .004) f.cur = f.goal;
      applyFade(f); need = true;
    }
  }
  if(marker.visible){
    markerT -= dt/1.1; marker.material.opacity = clamp(markerT,0,1)*.9; marker.scale.setScalar(1+(1-markerT)*1.6);
    if(markerT <= 0) marker.visible = false; need = true;
  }
  if(!need) return;

  if(S.mode === 'orbit' || (tw && S.dollhouse)){
    const w = stage.clientWidth, h = stage.clientHeight;
    VIEWS.forEach(v => {
      const el = tagEls[v.id]; if(!el) return;
      tv3.set(v.tag[0],v.tag[1],v.tag[2]).project(camera);
      el.style.transform = 'translate('+((tv3.x*.5+.5)*w).toFixed(1)+'px,'+((-tv3.y*.5+.5)*h).toFixed(1)+'px) translate(-50%,-50%)';
      el.style.zIndex = String(Math.round((1-tv3.z)*1000));
    });
  }
  renderer.render(scene,camera);
  if(firstDraw){ firstDraw = false; document.documentElement.setAttribute('data-ready','1'); }
}

/* ---------------- start ---------------- */
applyLang();
resize();
S.orbit.r = fitR();
setCam(orbitPose());
fadeGoals();
for(const k in FADE){ FADE[k].cur = FADE[k].goal; applyFade(FADE[k]); }
renderer.shadowMap.needsUpdate = true;
syncUI();
hintOnce('orbit');
requestAnimationFrame(frame);
window.__room = { S:S, goView:goView, goOrbit:goOrbit, okPos:okPos, lang:function(l){ lang = l; applyLang(); } };
})();
</script>
</body>
</html>
