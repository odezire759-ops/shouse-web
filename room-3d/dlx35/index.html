<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>S.House — ห้อง 3 มิติ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D stage. A slim title card floats top-left, the language switch top-right,
   and a scrolling rail of viewpoints sits on the bottom edge. Room labels float over the model. */
:root{
  --bg:#E8EEF6; --ink:#0F2B5B; --muted:#4F5F7A;
  --panel:rgba(255,255,255,.92); --line:rgba(15,43,91,.16);
  --accent:#0F2B5B; --accent-ink:#FFFFFF; --brand:#E06F1F; --brand-ink:#B8540F; --chip:#FFFFFF;
  --shadow:0 6px 24px rgba(15,43,91,.18);
  --font-display:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1730; --ink:#E8EEF8; --muted:#A5B4CC;
    --panel:rgba(14,26,50,.88); --line:rgba(232,238,248,.2);
    --accent:#F3A262; --accent-ink:#1A0E02; --brand:#F3A262; --brand-ink:#F3A262; --chip:#16264A;
    --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1730; --ink:#E8EEF8; --muted:#A5B4CC;
  --panel:rgba(14,26,50,.88); --line:rgba(232,238,248,.2);
  --accent:#F3A262; --accent-ink:#1A0E02; --brand:#F3A262; --brand-ink:#F3A262; --chip:#16264A;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--font-body);
  box-sizing:border-box; overflow:hidden;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
#stage{position:fixed; inset:0; z-index:0; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; background:#CFE0EA}
#stage.drag{cursor:grabbing}
#cv{display:block; width:100%; height:100%; outline:none}

.tags{position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden}
.tag{
  position:absolute; left:0; top:0; pointer-events:auto; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  background:var(--panel); color:var(--ink); border:1px solid var(--line);
  border-radius:999px; padding:6px 12px 6px 10px;
  font:500 13px/1 var(--font-display); white-space:nowrap;
  box-shadow:var(--shadow); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  opacity:0; visibility:hidden; transition:opacity .3s;
}
.tag::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--brand)}
.tags[data-on="1"] .tag{opacity:1; visibility:visible}
.tag:focus-visible,.chip:focus-visible,.lang button:focus-visible{outline:2px solid var(--brand); outline-offset:2px}

.ui{position:relative; z-index:2; height:100%; display:flex; flex-direction:column; justify-content:space-between; pointer-events:none; min-width:0}
.ui > *{min-width:0}
.top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.card{
  pointer-events:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.title{padding:10px 14px 11px; max-width:min(380px,66vw)}
.eyebrow{display:flex; align-items:center; gap:7px; font:600 12px/1 var(--font-display); letter-spacing:.14em; color:var(--brand-ink)}
.logo{display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; background:var(--brand); color:#fff; font:600 12px/1 var(--font-display); letter-spacing:0}
h1{margin:7px 0 0; font:600 21px/1.2 var(--font-display); text-wrap:balance}
.meta{margin:6px 0 0; font-size:13.5px; color:var(--ink); white-space:pre-line}
.note{margin:5px 0 0; font-size:12px; line-height:1.4; color:var(--muted)}
.lang{display:flex; padding:3px; gap:2px; border-radius:999px; flex:none}
.lang button{
  font:600 13px/1 var(--font-display); letter-spacing:.04em; color:var(--muted); background:transparent;
  border:0; border-radius:999px; padding:10px 12px; min-width:44px; min-height:40px; cursor:pointer;
}
.lang button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.topr{display:flex; flex-direction:column; align-items:stretch; gap:8px; flex:none; width:112px}
/* Realistic-mode switch: a physical push button with a lamp that lights up when on */
.real{
  pointer-events:auto; display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:9px; align-items:center; text-align:left;
  min-height:48px; padding:8px 13px 8px 11px; cursor:pointer; color:var(--ink); border-radius:14px;
  border:1px solid var(--line);
  background:var(--chip) linear-gradient(180deg,rgba(255,255,255,.34),rgba(0,0,0,.07));
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 -3px 5px rgba(0,0,0,.12) inset, var(--shadow);
  transition:transform .09s, box-shadow .12s; -webkit-tap-highlight-color:transparent;
}
.real:active{transform:translateY(2px); box-shadow:0 2px 6px rgba(0,0,0,.28) inset, 0 1px 2px rgba(0,0,0,.18)}
.real:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.real .led{
  width:13px; height:13px; border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#d4dae6,#8793aa);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.42), 0 0 0 2px rgba(0,0,0,.1);
}
.real[aria-pressed="true"] .led{
  background:radial-gradient(circle at 36% 30%,#fff4da,#ffb347 55%,#e8851a);
  box-shadow:0 0 10px 3px rgba(255,165,60,.7), inset 0 1px 1px rgba(255,255,255,.75);
}
.real[aria-busy="true"] .led{animation:realpulse .8s ease-in-out infinite}
@keyframes realpulse{50%{opacity:.3}}
.real b{display:block; font:600 14px/1.15 var(--font-display); letter-spacing:.01em}
.real small{display:block; margin-top:2px; font:500 12px/1.2 var(--font-body); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.real{transition:none} .real .led{animation:none}}
/* narrow phones: keep the column slim so the title card keeps its width */
@media (max-width:420px){.topr{width:98px} .real{min-height:46px; padding:7px 9px 7px 9px; column-gap:7px} .real b{font-size:13px} .real small{font-size:11px}}

.bottom{display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0}
.hint{
  pointer-events:none; background:var(--panel); color:var(--ink); border:1px solid var(--line);
  border-radius:999px; padding:8px 15px; font-size:13.5px; text-align:center; max-width:100%;
  box-shadow:var(--shadow); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  transition:opacity .5s; text-wrap:balance;
}
.hint[data-show="0"]{opacity:0}
.rail{
  pointer-events:auto; display:flex; gap:8px; max-width:100%; box-sizing:border-box;
  overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none; justify-content:safe center;
  -webkit-overflow-scrolling:touch;
}
.rail::-webkit-scrollbar{display:none}
.chip{
  flex:none; min-height:44px; padding:0 16px; cursor:pointer;
  font:500 14px/1 var(--font-display); color:var(--ink); background:var(--chip);
  border:1px solid var(--line); border-radius:999px; box-shadow:0 1px 3px rgba(15,43,91,.22);
}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:transparent}

.fail{position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; background:var(--bg)}
.fail[hidden]{display:none!important}
.fail p{max-width:32ch; margin:0; font-size:16px; line-height:1.6}
@media (prefers-reduced-motion:reduce){ .tag,.hint{transition:none} }
</style>
</head>
<body>

<div id="stage"><canvas id="cv" role="img" tabindex="0"></canvas></div>
<div class="tags" id="tags" data-on="0"></div>
<div class="ui">
  <div class="top">
    <div class="card title">
      <div class="eyebrow"><span class="logo" aria-hidden="true">S</span>S.HOUSE</div>
      <h1 id="ttl"></h1>
      <p class="meta" id="meta"></p>
      <p class="note" id="note"></p>
    </div>
    <div class="topr">
      <div class="card lang" role="group" aria-label="Language">
        <button id="lth" type="button" aria-pressed="true">TH</button>
        <button id="len" type="button" aria-pressed="false">EN</button>
      </div>
      <button class="real" id="real" type="button" aria-pressed="false" aria-busy="false">
        <span class="led" aria-hidden="true"></span>
        <span><b id="realT">สมจริง</b><small id="realS">ปิดอยู่</small></span>
      </button>
    </div>
  </div>
  <div class="bottom">
    <div class="hint" id="hint" role="status" data-show="0"></div>
    <div class="rail" id="rail" role="group"></div>
  </div>
</div>
<div class="fail" id="fail" hidden><p id="failtxt"></p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

const $ = id => document.getElementById(id);
const cv = $('cv'), stage = $('stage');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine = matchMedia('(pointer: fine)').matches;
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ------------------------------------------------------------------
   S.House Deluxe Room 35 sq.m. (corner room). Metres. Origin = centre of the bedroom floor. Room 5.4 (x) x 4.8 (z).
   Plan (rev 2, rebuilt from the four room photos):
   - EAST wall (+x) = bed head. Teal accent wall, king bed with a wooden headboard + small bedside cabinet on its south side.
     A lowered bulkhead (warm LED strip) runs over the bed niche.
   - NORTH wall (-z) = balcony side. From the bed's corner westwards: 3-pane aluminium slider + navy curtains, split A/C on the
     wall above it, a wall pier, then the window bay (bay pushes out to the north) with the green glass dining table.
   - Bathroom = a block in the SOUTH-EAST corner, right next to the bed. Its door is on the block's WEST face (faces the room),
     the door leaf swings into the bathroom. Inside: counter + sink on the north wall, toilet on the east (window) wall,
     shower behind a tiled half wall in the south-east corner.
   - SOUTH wall (+z): louvred 3-door wardrobe (west of the bathroom block), breaker box high near the south-west corner.
   - WEST wall (-x): the entrance door right beside the south-west corner, then the mirror + black-glass desk + pink chair,
     then the chest of drawers.
------------------------------------------------------------------- */
const ROOM = { W:5.4, D:4.8, H:2.6, T:0.14 };

const TXT = {
  th:{
    title:'ห้อง Deluxe 35 ตร.ม.',
    meta:['ห้องหัวมุม · ระเบียงส่วนตัววิวเมือง','มีมุมนั่งทานข้าวริมหน้าต่าง · ห้องน้ำในตัว'],
    note:'ภาพจำลอง 3 มิติ ขนาดและของตกแต่งอาจต่างจากห้องจริงเล็กน้อย · ทีวี-ตู้เย็นนำมาเองหรือเช่าได้',
    hintOrbit:'ลากเพื่อหมุนห้อง · บีบเพื่อซูม · แตะชื่อจุดเพื่อเข้าไปดู',
    hintWalk:'ลากเพื่อมองรอบห้อง · แตะที่พื้นเพื่อเดิน · บีบเพื่อซูม' + (fine ? ' · WASD' : ''),
    aria:'ภาพ 3 มิติของห้อง Deluxe 35 ตร.ม. ที่ S.House',
    fail:'อุปกรณ์หรือเบราว์เซอร์นี้แสดงภาพ 3 มิติไม่ได้ ลองเปิดด้วย Chrome หรือ Safari เวอร์ชันล่าสุด'
  },
  en:{
    title:'Deluxe Room 35 sq.m.',
    meta:['Corner room · Private balcony with city view','Window alcove with dining table · En-suite bathroom'],
    note:'3D model. Size and furnishings may differ slightly from the actual room. TV and fridge: bring your own or rent from us.',
    hintOrbit:'Drag to rotate · Pinch to zoom · Tap a label to step inside',
    hintWalk:'Drag to look around · Tap the floor to walk · Pinch to zoom' + (fine ? ' · WASD' : ''),
    aria:'3D view of the Deluxe 35 sq.m. room at S.House',
    fail:'This device or browser cannot show 3D. Try the latest Chrome or Safari.'
  }
};

const VIEWS = [
  { id:'overview', th:'ภาพรวม',           en:'Overview' },
  { id:'entry',   th:'ทางเข้า',             en:'Entrance',    pos:[-2.0,1.55,1.75],  at:[1.4,1.0,-0.7],    fov:78, tag:[-2.45,2.05,1.8] },
  { id:'bed',     th:'เตียง',               en:'Bed',         pos:[-2.1,1.5,-1.1],   at:[2.7,1.0,-1.1],   fov:74, tag:[2.2,1.55,-1.1] },
  { id:'closet',  th:'ตู้เสื้อผ้า',          en:'Wardrobe',    pos:[-0.65,1.5,-0.5],  at:[-0.65,1.0,2.4],   fov:80, tag:[-0.65,2.05,2.1] },
  { id:'desk',    th:'โต๊ะ · ตู้ลิ้นชัก',     en:'Desk',        pos:[0.1,1.5,-0.1],    at:[-2.7,1.0,0.3],    fov:82, tag:[-2.3,1.65,0.0] },
  { id:'dining',  th:'มุมทานข้าว',          en:'Dining nook', pos:[-0.2,1.5,0.5],    at:[-1.4,0.85,-2.9],  fov:80, tag:[-1.3,1.6,-2.85] },
  { id:'balcony', th:'ระเบียง',             en:'Balcony',     pos:[1.3,1.5,-2.2],    at:[1.3,-0.2,-6.2],   fov:74, tag:[1.4,1.3,-3.3] },
  { id:'bath',    th:'ห้องน้ำ',             en:'Bathroom',    pos:[0.85,1.55,0.85],  at:[2.4,0.95,1.4],    fov:100, tag:[1.6,1.75,1.3] }
];

/* Where a visitor may stand ([x0,x1,z0,z1]) and what blocks them */
const WALK = [
  [-2.5,0.35,-2.25,2.25],                         // west half of the room
  [0.35,0.62,-2.25,0.05],                         // foot of the bed
  [0.35,2.55,-2.3,-2.05],                         // strip between the bed and the balcony slider
  [-2.1,-0.5,-3.3,-2.25],                         // dining bay
  [0.3,2.5,-3.55,-2.3],                           // balcony
  [0.3,0.75,0.4,1.1],                             // bathroom doorway
  [0.75,2.6,0.3,2.3]                              // bathroom
];
const BLOCK = [
  [0.62,2.7,-2.0,-0.2],                           // bed
  [2.3,2.7,-0.2,0.1],                             // bedside cabinet
  [-1.5,0.2,1.8,2.4],                             // wardrobe
  [-2.7,-2.1,-0.3,1.0], [-2.2,-1.65,0.0,0.7],     // desk + chair
  [-2.7,-2.2,-1.2,-0.2],                          // chest of drawers
  [-1.75,-0.55,-3.2,-2.4], [-1.65,-0.6,-2.4,-1.85], [-2.2,-1.75,-3.05,-2.5],   // dining table + chairs
  [0.6,1.45,0.28,0.42], [1.5,2.3,0.2,0.78],       // bathroom door leaf, counter
  [2.2,2.7,0.8,1.3], [1.55,2.7,1.45,1.65]         // toilet, half wall
];
const FIT = [                                    // room box + dining bay + balcony
  [-2.85,0,2.55],[-2.85,2.7,2.55],[-2.85,0,-2.55],[-2.85,2.7,-2.55],[2.85,0,2.55],[2.85,2.7,2.55],[2.85,0,-2.55],[2.85,2.7,-2.55],
  [-2.35,0,-3.6],[-2.35,2.7,-3.6],[-0.25,0,-3.6],[-0.25,2.7,-3.6],
  [0.05,0,-3.9],[0.05,1.2,-3.9],[2.65,0,-3.9],[2.65,1.2,-3.9]
];
const ORBIT = { el:.98, t:[0.0,0.3,-0.45] };
const OVAZ = a => (-1.52+0.12*a);
const START = Object.assign({ x:-2.0, y:1.55, z:1.75, fov:78 }, anglesTo([-2.0,1.55,1.75],[1.4,1.0,-0.7]));



/* Start in the language the visitor already picked: ?lang= from the LINE button (th/en/zh/ja; zh and ja show English),
   then this viewer's own TH/EN toggle, then Thai. */
function normLang(v){ v = String(v || '').toLowerCase().slice(0,2); return v === 'th' ? 'th' : (v === 'en' || v === 'zh' || v === 'ja') ? 'en' : null; }
function queryLang(){ try{ return new URLSearchParams(location.search).get('lang'); }catch(e){ return null; } }
let lang = normLang(queryLang()) || normLang(LS.get('sh-lang')) || 'th';

const inAny = (L,x,z) => L.some(r => x>=r[0] && x<=r[1] && z>=r[2] && z<=r[3]);
const okPos = (x,z) => inAny(WALK,x,z) && !inAny(BLOCK,x,z);

function fail(){
  $('failtxt').textContent = TXT[lang].fail;
  $('fail').hidden = false;
}
const THREE = window.THREE;
if(!THREE){ fail(); return; }
let renderer;
try{
  renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true, powerPreference:'high-performance' });
}catch(e){ fail(); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // the room is static: shadows are rendered once
renderer.setClearColor(0xcfe0ea);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd5e5ee, 30, 180);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
const root = new THREE.Group(); scene.add(root);
const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

/* ---------------- helpers ---------------- */
const M = (c,o) => { const m = new THREE.MeshStandardMaterial(Object.assign({ color:c, roughness:.85, metalness:0 }, o||{})); m.userData.hex = c; return m; };
function B(x0,x1,y0,y1,z0,z1,m,parent,o){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0), m);
  mesh.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  mesh.castShadow = !(o && o.noCast); mesh.receiveShadow = !(o && o.noRecv);
  (parent||root).add(mesh); return mesh;
}
function cyl(r0,r1,h,m,x,y,z,parent,seg){
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r0,r1,h,seg||20), m);
  mesh.position.set(x,y,z); mesh.castShadow = true; mesh.receiveShadow = true;
  (parent||root).add(mesh); return mesh;
}
function rrShape(w,d,r){
  const s = new THREE.Shape(), x=-w/2, y=-d/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+d-r); s.quadraticCurveTo(x+w,y+d,x+w-r,y+d); s.lineTo(x+r,y+d);
  s.quadraticCurveTo(x,y+d,x,y+d-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
/* soft-cornered box: w (x) × h (y) × d (z), centred at x,y,z */
function rbox(w,h,d,r,b,m,x,y,z,parent){
  const sw = w-2*b, sd = d-2*b;
  const g = new THREE.ExtrudeGeometry(rrShape(sw,sd,Math.min(r,sw/2-.001,sd/2-.001)),
    { depth:h-2*b, bevelEnabled:true, bevelThickness:b, bevelSize:b, bevelSegments:2, curveSegments:6 });
  g.rotateX(-Math.PI/2); g.center();
  const mesh = new THREE.Mesh(g,m);
  mesh.position.set(x,y,z); mesh.castShadow = true; mesh.receiveShadow = true;
  (parent||root).add(mesh); return mesh;
}
let seed = 11;
const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
function canvasTex(w,h,draw){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = aniso;
  return t;
}
function tileCanvas(base,grout,noise,warm){
  return canvasTex(128,128,(g,w,h)=>{
    g.fillStyle = base; g.fillRect(0,0,w,h);
    for(let i=0;i<46;i++){ g.fillStyle = 'rgba(255,255,255,'+(rnd()*noise)+')'; g.fillRect(rnd()*w,rnd()*h,10+rnd()*50,10+rnd()*50); }
    for(let i=0;i<30;i++){ g.fillStyle = (warm||'rgba(80,60,40,')+(rnd()*noise*.7)+')'; g.fillRect(rnd()*w,rnd()*h,6+rnd()*40,6+rnd()*40); }
    g.strokeStyle = grout; g.lineWidth = 4; g.strokeRect(0,0,w,h);
  });
}
function tileM(tex,w,h,tw,th,o){
  const t = tex.clone(); t.needsUpdate = true; t.repeat.set(w/tw, h/th);
  return M(0xffffff, Object.assign({ map:t, roughness:.35 }, o||{}));
}
function blobTex(){
  return canvasTex(128,128,(g,w,h)=>{

/* ---------------- wall-relative kit ----------------

   s = position ALONG the wall (x for N/S, z for W/E), d = distance INTO the room from the wall plane
   (negative d = outside the room). */
const { W, D, H, T } = ROOM, hx = W/2, hz = D/2;

}
const FACE = { N:0, S:Math.PI, W:Math.PI/2, E:-Math.PI/2 };      // plane rotation.y so the plane faces into the room
const NORM = { N:[0,1], S:[0,-1], W:[1,0], E:[-1,0] };            // inward normal (x,z)
function WP(side,s,y,d,w,h,mat,parent,segW,segH){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h,segW||1,segH||1), mat);
  const p = XZ(side,s,d); m.position.set(p[0],y,p[1]); m.rotation.y = FACE[side];

}
/* wall with any number of openings: ops = [{a,b,y0,y1}] along the wall */
function wall(side,mat,ops,g,skirtMat){
  const horiz = side==='N' || side==='S';
  const ext = horiz ? [-hx-T,hx+T] : [-hz-T,hz+T];
  const pl = side==='N' ? [-hz-T,-hz] : side==='S' ? [hz,hz+T] : side==='W' ? [-hx-T,-hx] : [hx,hx+T];
  const box = (a0,a1,y0,y1) => { if(a1-a0 < 1e-3 || y1-y0 < 1e-3) return; horiz ? B(a0,a1,y0,y1,pl[0],pl[1],mat,g) : B(pl[0],pl[1],y0,y1,a0,a1,mat,g); };
  const sk = (a0,a1) => { if(skirtMat && a1-a0 > 1e-3) WB(side,Math.max(a0,horiz?-hx:-hz),Math.min(a1,horiz?hx:hz),0,.09,0,.016,skirtMat,g,{noCast:true}); };
  const L = (ops||[]).slice().sort((u,v) => u.a-v.a); let c = ext[0];
  L.forEach(o => { box(c,o.a,0,H); sk(c,o.a); box(o.a,o.b,0,o.y0||0); box(o.a,o.b,o.y1,H); c = o.b; });
  box(c,ext[1],0,H); sk(c,ext[1]);

  WB(side,a,a+.04,0,y1,-.1,-.03,fr,g); WB(side,b-.04,b,0,y1,-.1,-.03,fr,g);
  for(let i=1;i<n;i++){ const s = a+(b-a)*i/n; WB(side,s-.03,s+.03,0,y1,-.1,-.03,fr,g); }

    const rc = new THREE.Raycaster(), v = new THREE.Vector3(), box = new THREE.Box3(), cl = new Map();
    S.glass.forEach(o => {
      box.setFromObject(o); box.getSize(v);
      const ax = v.x < v.z ? 'x' : 'z', thin = v[ax], w = ax === 'x' ? v.z : v.x, h = v.y;
      if(thin > .16 || w*h < .45 || h < .6 || box.min.y > 1.3 || box.max.y < 1.2) return;
      const c = box.getCenter(new THREE.Vector3()), sign = c[ax] > 0 ? -1 : 1;   // inward = toward the room origin
      if(Math.abs(c[ax]) < .5) return;
      const origin = c.clone(); origin.y = box.min.y + h*.75;
      const dir = new THREE.Vector3(); dir[ax] = -sign;
      rc.set(origin, dir); rc.far = 2.2;
      if(rc.intersectObjects(S.solid, false).length) return;                       // enclosed -> not a window to the sky
      const key = ax + ':' + Math.round(c[ax]*8) + ':' + sign;
      if(!cl.has(key)) cl.set(key, { ax, sign, box:box.clone() }); else cl.get(key).box.union(box);

      const sz = k.box.getSize(new THREE.Vector3()), c = k.box.getCenter(new THREE.Vector3());
      return { ax:k.ax, sign:k.sign, c, w:k.ax === 'x' ? sz.z : sz.x, h:sz.y, area:(k.ax === 'x' ? sz.z : sz.x)*sz.y };
    }).sort((a,b) => b.area - a.area).slice(0,4);

  }

  /* ---------- sun: golden hour, from the biggest opening, side-stepped so the light patch lands on the floor inside ---------- */

    const up = .41, side = .42;                       // elevation / sideways bias (tan-ish)
    let best = null;
    const main = win[0];
    const out = new THREE.Vector3(); if(main) out[main.ax] = -main.sign; else out.set(0,0,-1);
    const tan = new THREE.Vector3(out.z, 0, -out.x);
    [-1,1].forEach(sg => {
      const d = out.clone().multiplyScalar(1).add(tan.clone().multiplyScalar(side*sg)).normalize();   // horizontal, toward the sun
      const dir = d.clone().multiplyScalar(Math.cos(Math.atan(up))); dir.y = Math.sin(Math.atan(up));  // unit vector toward the sun
      const c = main ? main.c : new THREE.Vector3(0,1.2,-2.4), t = (c.y - .02)/dir.y;
      const P = c.clone().addScaledVector(dir, -t);                                                      // where the beam through the window centre hits the floor

      if(!best || mg > best.mg) best = { dir, P, mg };

  /* ---------- environment (HDR sky dome with a sun disc) for reflections ---------- */
  function envMap(sunDir){
    const pm = new THREE.PMREMGenerator(renderer), es = new THREE.Scene();
    const g = new THREE.SphereGeometry(60,64,32), pos = g.attributes.position, col = new Float32Array(pos.count*3);
    const zen = lin(0x5F93C8).multiplyScalar(1.4), hor = lin(0xFFD2A0).multiplyScalar(3.2), gnd = lin(0x8A7660).multiplyScalar(.9), c = new THREE.Color();
    for(let i=0;i<pos.count;i++){
      const y = pos.getY(i)/60;
      if(y > 0) c.copy(hor).lerp(zen, Math.pow(y,.55)); else c.copy(hor).lerp(gnd, Math.pow(-y,.4));
      col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(col,3));
    const sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, depthWrite:false })); es.add(sky);
    const disc = new THREE.Mesh(new THREE.SphereGeometry(2.2,16,8), new THREE.MeshBasicMaterial({ color:new THREE.Color(1,.78,.5).multiplyScalar(60) }));
    disc.position.copy(sunDir).normalize().multiplyScalar(50); es.add(disc);
    const rt = pm.fromScene(es, .02); pm.dispose();
    g.dispose(); sky.material.dispose(); disc.geometry.dispose(); disc.material.dispose();
    return rt.texture;
  }

  function grainTex(){
    if(st.grain) return st.grain;

      g.fillStyle = '#F1E7D8'; g.fillRect(0,0,w,h);
      for(let i=0;i<90;i++){ const y = rnd()*h, t = .4+rnd()*1.8; g.strokeStyle = 'rgba('+(70+rnd()*50|0)+','+(40+rnd()*30|0)+',15,'+(.05+rnd()*.16)+')'; g.lineWidth = t;

      for(let i=0;i<3;i++){ const kx = rnd()*w, ky = rnd()*h; const r = g.createRadialGradient(kx,ky,1,kx,ky,10+rnd()*8);
        r.addColorStop(0,'rgba(60,32,10,.35)'); r.addColorStop(1,'rgba(60,32,10,0)'); g.fillStyle = r; g.fillRect(kx-24,ky-24,48,48); }

    return hsl.h >= .04 && hsl.h <= .12 && hsl.s >= .35 && hsl.s <= .85 && hsl.l >= .18 && hsl.l <= .72 && m.roughness >= .3 && m.roughness <= .7;

  }

  /* ---------- apply / undo the look ---------- */

    const sunDir = st.sunDir.dir;

    const exp = EXPOSURE * (st.win.length < 2 ? 1.2 : 1);          // a room with a single window gets a little more fill
    st.exp = exp; if(st.grade) st.grade.uniforms.exposure.value = exp;
    setP(renderer,'outputEncoding',THREE.sRGBEncoding); setP(renderer,'toneMapping',THREE.ACESFilmicToneMapping); setP(renderer,'toneMappingExposure',exp);
    if(scene.fog) setCol(scene.fog.color, scene.fog.color.clone().convertSRGBToLinear());
    setP(scene,'environment',null);
    try{ if(c.floatRT){ if(!st.env) st.env = envMap(sunDir); scene.environment = st.env; } }catch(e){ st.err = e && e.message; }

    /* materials: colours -> linear, glow boosts, reflections, wood grain */
    const texOld = new Map();
    S.mats.forEach(m => {
      if(m.color){
        const c2 = m.color.clone().convertSRGBToLinear();
        if(m.isMeshStandardMaterial && !ghostly(m) && !m.map && m.metalness < .3){ const f = .035; c2.r = Math.max(c2.r,f); c2.g = Math.max(c2.g,f); c2.b = Math.max(c2.b,f); }   // real black cloth/plastic still reflects ~3-4%

        else { gr.addColorStop(0,'#6FA6CE'); gr.addColorStop(.48,'#BBD6E6'); gr.addColorStop(.6,'#D5E5EE'); gr.addColorStop(1,'#D5E5EE'); }

    S.towers.forEach(o => setCol(o.material.color, lin(0xF0D6BC).multiplyScalar(2.6)));

    S.blobs.forEach(o => setP(o.material,'opacity', o.material.opacity*.3));

    S.hemi.forEach(l => { setCol(l.color, lin(0xB9D1EC)); setCol(l.groundColor, lin(0xA98B69)); setP(l,'intensity',.12); });
    S.point.forEach(l => { setCol(l.color, l.color.clone().convertSRGBToLinear().lerp(lin(0xFFC48A), .45)); setP(l,'intensity', l.intensity*.8); });

      setCol(sun.color, lin(0xFFC585)); setP(sun,'intensity',4.0);
      sun.target.position.set(0,0,0); sun.position.copy(sunDir).multiplyScalar(14);
      Object.assign(sc,{ left:-8, right:8, top:8, bottom:-8, near:1, far:40 }); sc.updateProjectionMatrix();
      sun.shadow.bias = -.0004; sun.shadow.normalBias = .018; sun.shadow.mapSize.set(hi ? 4096 : 2048, hi ? 4096 : 2048);
      sun.shadow.map = null;                                   // the realistic look bakes its own map; the engine's original one (keep.map) is left untouched
      rec(() => {
        sun.position.copy(keep.pos); sun.target.position.copy(keep.tgt);

  /* The engine renders its sun shadow once (shadowMap.autoUpdate = false) in whatever fade state the page happens to be in: in the overview the ceiling

    const rt = st.bakeRT || (st.bakeRT = new THREE.WebGLRenderTarget(2,2)), prev = renderer.getRenderTarget();

      if(c.floatLin){
        RectLib();

        const p = w.c.clone(); p[w.ax] += -w.sign*.04; l.position.copy(p);
        const look = w.c.clone(); look[w.ax] += w.sign*1; look.y = Math.max(.3, w.c.y - .45); l.lookAt(look);

      }

      const mk = (x,z,I,d) => { const l = new THREE.PointLight(lin(0xFFB873), I, d, 1.6); l.position.set(x,.55,z); l.visible = false; scene.add(l); st.extras.push(l); };

    get busy(){ return st.busy; },
    lang(l){ st.lang = l === 'en' ? 'en' : 'th'; label(); },
    toggle(){

      st.composer.setPixelRatio(renderer.getPixelRatio());
      st.composer.setSize(w,h);
      st.grade.uniforms.res.value.set(w*renderer.getPixelRatio(), h*renderer.getPixelRatio());

    render(){
      const t0 = performance.now();
      if(st.on && st.tier >= 2 && st.composer){ st.composer.render(); adapt(t0); }
      else{ renderer.render(scene,camera); if(st.on) adapt(t0); }
    },
    state(){ return st; }
  };
  return api;
})();

/* ---------------- environment + lights ---------------- */
sky();
skyline([{ x0:-110, x1:110, z0:-125, z1:-32, n:24 }, { x0:-125, x1:-48, z0:-60, z1:55, n:9 }]);
scene.add(new THREE.HemisphereLight(0xEFF3F4, 0xBBA98F, .62));
const sun = new THREE.DirectionalLight(0xFFF0D8, .55);
sun.position.set(-2,7,-16); sun.target.position.set(0,0,0);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{ left:-10, right:10, top:10, bottom:-10, near:1, far:45 });

  WB('E',-0.26,0.04,.28,.38,.4,.43,pineL); WB('E',-0.14,-0.08,.31,.35,.43,.45,chrome,root,{noCast:true});
  [[-0.27,.05],[.05,.05],[-0.27,.35],[.05,.35]].forEach(p => WB('E',p[0]-.015,p[0]+.015,0,.25,p[1]-.015,p[1]+.015,pineD,root,{noCast:true}));
  WB('E',-0.1,0.0,.76,.86,.0,.014,M(0xF2F0E8,{roughness:.5}),root,{noCast:true});                               // wall socket
  // frosted square wall lamp
  WB('E',-1.2,-1.0,1.62,1.88,0,.09,M(0xCFE4E0,{emissive:0x5E8F8A,roughness:.4}),root,{noCast:true});
  { const lp = new THREE.PointLight(0xCFF1EC,.18,2.6,1.6); const q = XZ('E',-1.1,.3); lp.position.set(q[0],1.75,q[1]); scene.add(lp); }
  // base, mattress, duvet, pillows
  B(.64,hx-.06,.06,.4,bz0,bz2,pine); B(.68,hx-.1,0,.06,bz0+.04,bz2-.04,pineD);
  rbox(1.96,.24,1.78,.05,.04,M(0xF6F3EC,{roughness:.95}),hx-.06-.98,.52,bcz);
  rbox(1.5,.09,1.82,.05,.04,M(0xffffff,{map:duvetTex('#F7F4EC','rgba(150,140,122,.3)',6),roughness:.95}),hx-.06-1.2,.665,bcz);
  [bcz-.42,bcz+.42].forEach(z => { rbox(.42,.14,.64,.07,.05,M(0xFAFAF8,{roughness:.95}),hx-.4,.72,z); rbox(.3,.13,.62,.07,.05,M(0xFAFAF8,{roughness:.95}),hx-.2,.8,z).rotation.z = .22; });
  blob(1.7,bcz,2.9,2.3,.4);
}

/* ---------------- louvred 3-door wardrobe (south wall, west of the bathroom) ---------------- */
{
  const lv = canvasTex(256,256,(g,w,h) => {
    g.fillStyle = '#AE7A3C'; g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=12){ g.fillStyle = '#8F5A25'; g.fillRect(0,y,w,3); g.fillStyle = 'rgba(255,225,170,.25)'; g.fillRect(0,y+3,w,2); }
  });
  lv.repeat.set(1,1.7/.45);
  const lm = M(0xE2CDB0,{map:lv,roughness:.6}), kb = M(0x5A3414,{roughness:.5});
  WB('S',-1.45,.15,.02,1.75,0,.55,pineD);
  WB('S',-0.43,.13,.05,1.72,.55,.575,lm,root,{noCast:true});                                // east sliding door
  WB('S',-0.9,-0.41,.05,1.72,.575,.6,lm,root,{noCast:true});                                // middle sliding door (in front)
  WB('S',-1.43,-0.92,.62,1.73,.55,.575,lm,root,{noCast:true});                              // west hinged door
  [[.05,.2],[.22,.37],[.39,.55]].forEach(r => { WB('S',-1.43,-0.92,r[0],r[1],.55,.58,pineL,root,{noCast:true});
    const q = XZ('S',-1.175,.6); const k = new THREE.Mesh(new THREE.SphereGeometry(.022,10,8), kb); k.position.set(q[0],(r[0]+r[1])/2,q[1]); root.add(k); });
  { const q = XZ('S',-0.94,.585); const k = new THREE.Mesh(new THREE.SphereGeometry(.022,10,8), kb); k.position.set(q[0],1.0,q[1]); root.add(k); }
  WB('S',-0.42,-0.4,.05,1.72,.6,.61,M(0x5A3414,{roughness:.7}),root,{noCast:true});
  blob(-0.65,2.1,1.9,1.0,.4);
}

/* ---------------- west wall: mirror, black-glass desk, pink chair, chest of drawers ---------------- */
{
  const dkM = M(0x161617,{roughness:.2,metalness:.1});
  // desk (z -0.25 .. 0.95)
  WB('W',-0.25,0.95,.74,.78,0,.55,dkM);
  WB('W',-0.25,0.95,.66,.74,.02,.53,pine);
  [[-0.25,-0.2,0,.05],[0.9,0.95,0,.05],[-0.25,-0.2,.5,.55],[0.9,0.95,.5,.55]].forEach(l => WB('W',l[0],l[1],0,.74,l[2],l[3],pine));
  WB('W',-0.2,0.9,.14,.19,.26,.3,pine);
  WB('W',-0.2,0.28,.55,.7,.53,.56,pineL); WB('W',0.0,0.08,.62,.64,.56,.58,chrome,root,{noCast:true});
  // wooden-framed mirror above the desk
  WB('W',0.0,0.7,1.1,1.95,0,.04,pine,root,{noCast:true});
  WB('W',0.04,0.66,1.14,1.91,.04,.046,mirrorM,root,{noCast:true});
  // chest of drawers: open shelf over two drawers (z -1.15 .. -0.25)
  WB('W',-1.15,-0.25,0,.8,0,.45,pine);
  WB('W',-1.1,-0.3,.36,.74,.43,.452,M(0x6E4620,{roughness:.8}),root,{noCast:true});
  WB('W',-1.1,-0.3,.54,.56,.1,.452,pineL,root,{noCast:true});
  WB('W',-1.12,-0.72,.04,.33,.45,.47,pineL); WB('W',-0.68,-0.28,.04,.33,.45,.47,pineL);
  [-0.92,-0.48].forEach(z => WB('W',z-.04,z+.04,.17,.2,.47,.5,chrome,root,{noCast:true}));
  WB('W',-1.17,-0.23,.8,.83,-.01,.47,pineL);
  blob(-1.9,0.35,1.5,1.6,.35); blob(-2.0,-0.7,1.0,1.0,.3);
  shellChair(-1.95,0.35,-Math.PI/2,M(0xE8A3B6,{roughness:.45}),M(0xC9A272,{roughness:.6}));
}

/* ---------------- dining bay: glass table + 3 chairs ---------------- */
{
  const tx = -1.15, tz = -2.8, glassT = new THREE.MeshStandardMaterial({ color:0x1E3A33, roughness:.08, metalness:.1, transparent:true, opacity:.78, depthWrite:false });
  const tc = M(0x1B1B1D,{roughness:.4,metalness:.4});
  B(tx-.55,tx+.55,.72,.745,tz-.35,tz+.35,M(0xEFE9D2,{roughness:.5}),root,{noCast:true});
  const tg = new THREE.Mesh(new THREE.BoxGeometry(1.06,.012,.66), glassT); tg.position.set(tx,.752,tz); root.add(tg);
  [[-.45,-.25],[.45,-.25],[-.45,.25],[.45,.25]].forEach(p => B(tx+p[0]-.02,tx+p[0]+.02,0,.72,tz+p[1]-.02,tz+p[1]+.02,tc));
  const seat = M(0x6D2530,{roughness:.6}), back = M(0xD9894A,{roughness:.55}), leg = M(0xC9CFD1,{roughness:.3,metalness:.7});
  diningChair(tx-.28,tz+.62,Math.PI,seat,back,leg);       // south side, facing the window
  diningChair(tx+.3,tz+.62,Math.PI+.12,seat,back,leg);
  diningChair(tx-.78,tz,Math.PI/2,seat,back,leg);          // west end, facing the table (+x)
  blob(tx,tz+.2,1.9,1.7,.4);
}


/* ---------------- walk marker ---------------- */
const marker = new THREE.Mesh(new THREE.RingGeometry(.12,.17,32), new THREE.MeshBasicMaterial({ color:0xE06F1F, transparent:true, opacity:0, depthWrite:false, side:THREE.DoubleSide }));
marker.rotation.x = -Math.PI/2; marker.visible = false; marker.renderOrder = 3; scene.add(marker);
let markerT = 0;

/* ================= camera control ================= */
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const S = {
  mode:'orbit', dollhouse:true, cur:'overview', zoomed:false, rotated:false,
  orbit:{ az:-.7, el:ORBIT.el, r:16, t:new THREE.Vector3(ORBIT.t[0],ORBIT.t[1],ORBIT.t[2]) },
  walk:Object.assign({}, START)
};
let tw = null, dirty = true, last = performance.now(), firstDraw = true;
const tmpC = new THREE.PerspectiveCamera();

function aspect(){ return camera.aspect || 1; }
function effFov(base){
  const a = aspect();
  if(a >= 1) return base;
  return Math.min(98, 2*Math.atan(Math.tan(base*Math.PI/360)*.8/a)*180/Math.PI);
}
function overviewAz(){ return OVAZ(clamp((aspect()-.5)/.9,0,1)); }
const FIT_PTS = [];
/* FIT = [x0,x1,y0,y1,z0,z1] box, or a list of [x,y,z] points when the plan is not box-shaped (L-shaped with a bath/balcony wing) */
if(typeof FIT[0] === 'number') [FIT[0],FIT[1]].forEach(x => [FIT[2],FIT[3]].forEach(y => [FIT[4],FIT[5]].forEach(z => FIT_PTS.push(new THREE.Vector3(x,y,z)))));
else FIT.forEach(q => FIT_PTS.push(new THREE.Vector3(q[0],q[1],q[2])));
const fitCam = new THREE.PerspectiveCamera(38,1,.1,500), fitV = new THREE.Vector3();
function fitR(){
  const a = aspect(), keep = S.orbit.r; let lo = 6, hi = 42;
  fitCam.aspect = a; fitCam.updateProjectionMatrix();
  for(let i=0;i<14;i++){
    const mid = (lo+hi)/2; S.orbit.r = mid;
    const p = orbitPose(); fitCam.position.copy(p.pos); fitCam.quaternion.copy(p.quat); fitCam.updateMatrixWorld();
    let m = 0;
    FIT_PTS.forEach(v => { fitV.copy(v).project(fitCam); m = Math.max(m, Math.abs(fitV.x)/.92, Math.abs(fitV.y)/.86); });
    if(m > 1) lo = mid; else hi = mid;
  }
  S.orbit.r = keep; return hi;
}
function orbitPose(){
  const o = S.orbit, ce = Math.cos(o.el);
  const pos = new THREE.Vector3(o.t.x+o.r*ce*Math.sin(o.az), o.t.y+o.r*Math.sin(o.el), o.t.z+o.r*ce*Math.cos(o.az));
  tmpC.position.copy(pos); tmpC.up.set(0,1,0); tmpC.lookAt(o.t);
  return { pos, quat:tmpC.quaternion.clone(), fov:38 };
}
function walkPose(w){
  return { pos:new THREE.Vector3(w.x,w.y,w.z), quat:new THREE.Quaternion().setFromEuler(new THREE.Euler(w.pitch,w.yaw,0,'YXZ')), fov:effFov(w.fov) };
}
function setCam(p){
  camera.position.copy(p.pos); camera.quaternion.copy(p.quat);
  if(Math.abs(camera.fov-p.fov) > .01){ camera.fov = p.fov; camera.updateProjectionMatrix(); }
}
function anglesTo(from,at){
  const dx = at[0]-from[0], dy = at[1]-from[1], dz = at[2]-from[2];
  return { yaw:Math.atan2(-dx,-dz), pitch:Math.atan2(dy,Math.hypot(dx,dz)) };
}
function fly(pose,dur,done,walkTarget){
  const d = camera.position.distanceTo(pose.pos);
  const time = reduce ? .01 : (dur || clamp(.7+d*.2,.8,2.0));
  tw = { p0:camera.position.clone(), q0:camera.quaternion.clone(), f0:camera.fov, p1:pose.pos, q1:pose.quat, f1:pose.fov, t:0, dur:time, done:done, walkTarget:!!walkTarget };
  S.mode = 'fly'; dirty = true; syncUI();
}
function viewWalk(v){
  const a = anglesTo(v.pos,v.at);
  return { x:v.pos[0], y:v.pos[1], z:v.pos[2], yaw:a.yaw, pitch:a.pitch, fov:v.fov };
}
function goOrbit(){
  if(S.mode === 'fly' && S.cur === 'overview') return;
  S.cur = 'overview'; S.dollhouse = true;
  if(!S.rotated) S.orbit.az = overviewAz();
  if(!S.zoomed) S.orbit.r = fitR();
  fly(orbitPose(), 0, () => { S.mode = 'orbit'; dirty = true; syncUI(); });
}
function goView(id){
  const v = VIEWS.find(x => x.id === id); if(!v || !v.pos) return;
  const w = viewWalk(v); S.cur = id;
  fly(walkPose(w), 0, () => { S.walk = w; S.mode = 'walk'; S.dollhouse = false; dirty = true; syncUI(); }, S.dollhouse);
  if(!S.dollhouse) return;
  hintOnce('walk');
}
function walkTo(x,z){
  if(!okPos(x,z)) return;
  const w = Object.assign({}, S.walk, { x:x, z:z });
  S.cur = '';
  fly(walkPose(w), 0, () => { S.walk = w; S.mode = 'walk'; dirty = true; syncUI(); });
  marker.position.set(x,.02,z); marker.visible = true; markerT = 1;
}

/* ---------------- input ---------------- */
const ptrs = new Map(); let tap = null, pinchD = 0;
const pdist = () => { const a = Array.from(ptrs.values()); return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); };
stage.addEventListener('pointerdown', e => {
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  ptrs.set(e.pointerId,{ x:e.clientX, y:e.clientY });
  hideHint();
  if(ptrs.size === 1){ tap = { x:e.clientX, y:e.clientY, t:performance.now(), moved:false }; stage.classList.add('drag'); }
  else { tap = null; pinchD = pdist(); }
});
stage.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if(!p) return;
  const dx = e.clientX-p.x, dy = e.clientY-p.y; p.x = e.clientX; p.y = e.clientY;
  if(S.mode === 'fly') return;
  if(ptrs.size === 1){
    if(tap && Math.hypot(e.clientX-tap.x, e.clientY-tap.y) > 6) tap.moved = true;
    if(S.mode === 'orbit'){
      S.rotated = true; S.orbit.az -= dx*.006; S.orbit.el = clamp(S.orbit.el+dy*.005,.25,1.5);
    }else if(S.mode === 'walk'){
      const k = S.walk.fov/74*.0042;
      S.walk.yaw += dx*k; S.walk.pitch = clamp(S.walk.pitch+dy*k,-1.2,1.2);
    }
    dirty = true;
  }else if(ptrs.size === 2){
    const d = pdist(), ratio = pinchD ? d/pinchD : 1; pinchD = d;
    zoom(ratio);
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(ptrs.size === 0) stage.classList.remove('drag');
  if(e.type === 'pointerup' && tap && !tap.moved && performance.now()-tap.t < 500 && S.mode === 'walk') pickFloor(e.clientX,e.clientY);
  tap = null; pinchD = 0;
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
function zoom(ratio){
  if(S.mode === 'orbit'){ S.orbit.r = clamp(S.orbit.r/ratio,6,32); S.zoomed = true; }
  else if(S.mode === 'walk'){ S.walk.fov = clamp(S.walk.fov/ratio,40,90); }
  dirty = true;
}
stage.addEventListener('wheel', e => { e.preventDefault(); hideHint(); zoom(Math.exp(-e.deltaY*.0012)); }, { passive:false });
const ray = new THREE.Raycaster(), floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0),0), hit = new THREE.Vector3();
function pickFloor(cx,cy){
  const r = stage.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1), camera);
  if(ray.ray.intersectPlane(floorPlane,hit)) walkTo(hit.x,hit.z);
}
const keys = new Set(), MOVE = ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(MOVE.indexOf(k) < 0 || e.ctrlKey || e.metaKey || e.altKey) return;
  keys.add(k); hideHint(); if(S.mode === 'walk') e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

/* ---------------- UI ---------------- */
const rail = $('rail'), tagsEl = $('tags'), hint = $('hint');
const chips = {}, tagEls = {};
VIEWS.forEach(v => {
  const c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.setAttribute('aria-pressed','false');
  c.addEventListener('click', () => v.id === 'overview' ? goOrbit() : goView(v.id));
  rail.appendChild(c); chips[v.id] = c;
  if(v.tag){
    const t = document.createElement('button'); t.type = 'button'; t.className = 'tag';
    t.addEventListener('click', () => goView(v.id));
    tagsEl.appendChild(t); tagEls[v.id] = t;
  }
});
let hintTimer = 0; const hintSeen = {};
function showHint(txt){ hint.textContent = txt; hint.dataset.show = '1'; clearTimeout(hintTimer); hintTimer = setTimeout(hideHint,7000); }
function hideHint(){ hint.dataset.show = '0'; clearTimeout(hintTimer); }
function hintOnce(kind){ if(hintSeen[kind]) return; hintSeen[kind] = 1; setTimeout(() => showHint(kind === 'walk' ? TXT[lang].hintWalk : TXT[lang].hintOrbit), kind === 'walk' ? 900 : 400); }
function syncUI(){
  VIEWS.forEach(v => chips[v.id].setAttribute('aria-pressed', String(v.id === S.cur)));
  tagsEl.dataset.on = (S.mode === 'orbit') ? '1' : '0';
  const c = chips[S.cur]; if(c && c.scrollIntoView){ try{ c.scrollIntoView({ block:'nearest', inline:'center', behavior: reduce ? 'auto' : 'smooth' }); }catch(e){} }
}
function applyLang(){
  const t = TXT[lang];
  document.documentElement.lang = lang;
  $('ttl').textContent = t.title; $('meta').textContent = t.meta.join('\n'); $('note').textContent = t.note;
  cv.setAttribute('aria-label', t.aria);
  VIEWS.forEach(v => { chips[v.id].textContent = v[lang]; if(tagEls[v.id]) tagEls[v.id].textContent = v[lang]; });
  CINE.lang(lang);
  $('lth').setAttribute('aria-pressed', String(lang === 'th')); $('len').setAttribute('aria-pressed', String(lang === 'en'));
  document.title = 'S.House ' + t.title;
  if(hint.dataset.show === '1') hint.textContent = (S.mode === 'walk') ? t.hintWalk : t.hintOrbit;
}
$('lth').addEventListener('click', () => { lang = 'th'; LS.set('sh-lang','th'); applyLang(); });
$('len').addEventListener('click', () => { lang = 'en'; LS.set('sh-lang','en'); applyLang(); });
$('real').addEventListener('click', () => CINE.toggle());

/* ---------------- loop ---------------- */
function resize(){
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w,h,false); camera.aspect = w/h; CINE.setSize(w,h);
  if(S.mode === 'orbit' && !S.zoomed){ if(!S.rotated) S.orbit.az = overviewAz(); S.orbit.r = fitR(); }
  camera.updateProjectionMatrix(); dirty = true;
}
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage); else addEventListener('resize',resize);

const tv3 = new THREE.Vector3();
function fadeGoals(){
  const o = S.orbit, dx = Math.sin(o.az), dz = Math.cos(o.az), top = o.el > 1.38;
  const dh = S.dollhouse;
  const g = face => dh ? ((top || face > .22) ? 0 : 1) : 1;
  FADE.N.goal = g(-dz); FADE.S.goal = g(dz); FADE.W.goal = g(-dx); FADE.E.goal = g(dx);
  FADE.C.goal = dh ? 0 : 1; if(FADE.P) FADE.P.goal = dh ? .16 : 1;
}
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05,(now-last)/1000); last = now;
  let need = dirty; dirty = false;

  if(S.mode === 'walk' && keys.size){
    const has = k => keys.has(k);
    const fz = (has('w')||has('arrowup') ? 1:0) - (has('s')||has('arrowdown') ? 1:0);
    const fx = (has('d') ? 1:0) - (has('a') ? 1:0);
    const turn = (has('arrowleft') ? 1:0) - (has('arrowright') ? 1:0);
    S.walk.yaw += turn*1.6*dt;
    if(fx || fz){
      const sy = Math.sin(S.walk.yaw), cy = Math.cos(S.walk.yaw), sp = 1.5*dt;
      const nx = S.walk.x + (-sy*fz + cy*fx)*sp, nz = S.walk.z + (-cy*fz - sy*fx)*sp;
      if(okPos(nx,S.walk.z)) S.walk.x = nx;
      if(okPos(S.walk.x,nz)) S.walk.z = nz;
    }
    need = true;
  }
  if(tw){
    tw.t += dt/tw.dur; const k0 = Math.min(1,tw.t), k = k0*k0*(3-2*k0);
    camera.position.lerpVectors(tw.p0,tw.p1,k);
    camera.quaternion.copy(tw.q0).slerp(tw.q1,k);
    camera.fov = tw.f0 + (tw.f1-tw.f0)*k; camera.updateProjectionMatrix();
    if(tw.walkTarget && k > .5 && S.dollhouse) S.dollhouse = false;
    if(tw.t >= 1){ const d = tw.done; tw = null; if(d) d(); }
    need = true;
  }else if(need){
    if(S.mode === 'orbit') setCam(orbitPose()); else if(S.mode === 'walk') setCam(walkPose(S.walk));
  }
  fadeGoals();
  for(const k in FADE){
    const f = FADE[k];
    if(f.cur !== f.goal){
      f.cur += (f.goal-f.cur)*Math.min(1,dt*(reduce?60:9));
      if(Math.abs(f.cur-f.goal) < .004) f.cur = f.goal;
      applyFade(f); need = true;
    }
  }
  if(marker.visible){
    markerT -= dt/1.1; marker.material.opacity = clamp(markerT,0,1)*.9; marker.scale.setScalar(1+(1-markerT)*1.6);
    if(markerT <= 0) marker.visible = false; need = true;
  }
  if(!need) return;

  if(S.mode === 'orbit' || (tw && S.dollhouse)){
    const w = stage.clientWidth, h = stage.clientHeight;
    VIEWS.forEach(v => {
      const el = tagEls[v.id]; if(!el) return;
      tv3.set(v.tag[0],v.tag[1],v.tag[2]).project(camera);
      el.style.transform = 'translate('+((tv3.x*.5+.5)*w).toFixed(1)+'px,'+((-tv3.y*.5+.5)*h).toFixed(1)+'px) translate(-50%,-50%)';
      el.style.zIndex = String(Math.round((1-tv3.z)*1000));
    });
  }
  CINE.render();
  if(firstDraw){ firstDraw = false; document.documentElement.setAttribute('data-ready','1'); }
}

/* ---------------- start ---------------- */
applyLang();
resize();
S.orbit.r = fitR();
setCam(orbitPose());
fadeGoals();
for(const k in FADE){ FADE[k].cur = FADE[k].goal; applyFade(FADE[k]); }
renderer.shadowMap.needsUpdate = true;
syncUI();
hintOnce('orbit');
requestAnimationFrame(frame);
if(CINE.auto()) setTimeout(() => CINE.toggle(), 80);          // ?real=1, or the visitor left Realistic mode on last time
window.__room = { cine:CINE, S:S, goView:goView, goOrbit:goOrbit, okPos:okPos, lang:function(l){ lang = l; applyLang(); } };
})();
</script>
